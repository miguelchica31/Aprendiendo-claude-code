<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contador</title>
</head>
<body style="background-color: #2b2b2b; color: #ffffff;">
<p id="valor">0</p>
<button onclick="cambiar(-1)">-</button>
<button onclick="cambiar(1)">+</button>
<script>
var n = 0;
function cambiar(d) {
  n += d;
  document.getElementById("valor").textContent = n;
}
</script>
</body>
</html>
